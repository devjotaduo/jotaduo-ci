name: Tests

on:
  push:
    branches:
      - 'run/**'
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag ou commit do repositório de origem
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event_name == 'push' && github.ref_name || inputs.ref }}
  cancel-in-progress: true

run-name: Tests ${{ github.event_name == 'push' && github.ref_name || inputs.ref }}

jobs:
  plan:
    runs-on: [self-hosted, linux, x64, jotaduo-ci]
    timeout-minutes: 5
    outputs:
      ref: ${{ steps.ref.outputs.ref }}
      base: ${{ steps.ref.outputs.base }}
    steps:
      - name: Resolve source ref
        id: ref
        env:
          EVENT_NAME: ${{ github.event_name }}
          TRIGGER_BRANCH: ${{ github.ref_name }}
          INPUT_REF: ${{ inputs.ref }}
        run: |
          # Um push em run/pr-<número>-<commit>-<execução>-<tentativa> pede o teste do merge desse pull request.
          # Com run/affected-pr-..., só os testes que o diff do pull request alcança.
          if [ "$EVENT_NAME" = push ]; then
            [[ "$TRIGGER_BRANCH" =~ ^run/(affected-)?pr-([0-9]+)-[0-9a-f]{40}(-[0-9]+-[0-9]+)?$ ]] || { echo "Branch de disparo inválida."; exit 1; }
            echo "ref=refs/pull/${BASH_REMATCH[2]}/merge" >> "$GITHUB_OUTPUT"
            # O primeiro pai do commit de merge é a base do pull request.
            if [ -n "${BASH_REMATCH[1]}" ]; then echo 'base=HEAD^1'; else echo 'base=full'; fi >> "$GITHUB_OUTPUT"
          else
            echo "ref=$INPUT_REF" >> "$GITHUB_OUTPUT"
            echo 'base=full' >> "$GITHUB_OUTPUT"
          fi

  tests:
    name: ${{ matrix.suite }}
    needs: plan
    runs-on: [self-hosted, linux, x64, jotaduo-ci]
    timeout-minutes: 90
    strategy:
      fail-fast: false
      # Duas instalações do monorepo cabem no volume atual com margem; três
      # chegaram a esgotar o disco do host durante o link do Yarn.
      max-parallel: 2
      matrix:
        include:
          - suite: overlays
            command: |
              result=0
              node packages/twenty-utils/overlays/overlays.mjs status || result=1
              node packages/twenty-utils/overlays/overlays.mjs check --all || result=1
              exit "$result"
          - suite: shared
            command: $YARN nx test twenty-shared --ci --maxWorkers=2 --coverage=false --skip-nx-cache --parallel=1
          - suite: frontend
            command: $YARN nx test twenty-front --ci --maxWorkers=4 --coverage=false --skip-nx-cache --parallel=1
          - suite: server
            command: $YARN nx run twenty-server:test:ci --skip-nx-cache --parallel=1
          - suite: ui
            command: |
              $YARN nx run-many --projects=twenty-ui --targets=check:ownership,test:exports --skip-nx-cache --parallel=1
              $YARN workspace twenty-ui vitest run --project unit --maxWorkers=4
          # Mesmos passos do ci-cli.yaml do upstream, sem o registro local e o app de ponta a ponta.
          # O pacote twenty-cli se chama "twenty".
          - suite: cli
            command: |
              $YARN nx run-many --target=build --projects=twenty-sdk,twenty-cli --skip-nx-cache --parallel=1
              $YARN nx lint twenty-cli --skip-nx-cache
              $YARN nx typecheck twenty-cli --skip-nx-cache
              $YARN workspace twenty vitest run --maxWorkers=2 --exclude src/app/manifest/__tests__/manifest-fixtures.spec.ts
              $YARN workspace twenty vitest run --maxWorkers=1 src/app/manifest/__tests__/manifest-fixtures.spec.ts
          # Fora do seletor: typecheck e lint olham os pacotes inteiros, não só o que o diff alcança.
          - suite: typecheck
            selector: false
            command: $YARN nx run-many --targets=typecheck --projects=twenty-server,twenty-front --skip-nx-cache --parallel=1
          # lint:unlocalized-strings do front já falha na main da origem e bloquearia o oxlint, que depende dele.
          - suite: lint
            selector: false
            command: |
              $YARN nx build twenty-oxlint-rules --skip-nx-cache --parallel=1
              $YARN nx run-many --targets=lint --projects=twenty-server,twenty-front --exclude-task-dependencies --skip-nx-cache --parallel=1
    env:
      CI: 'true'
      NX_DAEMON: 'false'
      NX_NO_CLOUD: 'true'
      NX_PARALLEL: '1'
      NODE_OPTIONS: --max-old-space-size=6144
      YARN: node .yarn/releases/yarn-4.18.1.cjs
      # Mantém os arquivos ZipFS do Yarn dentro do temporário isolado do job.
      TMPDIR: ${{ runner.temp }}/yarn-tmp
      TEST_BASE: ${{ needs.plan.outputs.base }}
      SELECTOR: packages/twenty-utils/ci/run-affected-tests.sh
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: devjotaduo/jotaduo-v0.01
          ref: ${{ needs.plan.outputs.ref }}
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          persist-credentials: false
          fetch-depth: 0
      - name: Plan ${{ matrix.suite }}
        id: plan
        env:
          SUITE: ${{ matrix.suite }}
          # Chave ausente chega vazia; só selector: false desliga o seletor.
          USE_SELECTOR: ${{ matrix.selector }}
        run: |
          # Uma linha sem o seletor, um seletor que ainda não conhece a suíte (como cli antes do
          # local-ci v25) ou uma suíte com selector: false roda a suíte inteira pelo comando da matriz.
          if [ -f "$SELECTOR" ] && [ "$USE_SELECTOR" != false ] && grep -qE "^[[:space:]]+$SUITE\)" "$SELECTOR"; then
            scope=$(bash "$SELECTOR" plan "$SUITE" "$TEST_BASE")
          else
            scope=legacy
          fi
          echo "scope=$scope" | tee -a "$GITHUB_OUTPUT"
      - name: Prepare package temporary directory
        if: matrix.suite != 'overlays' && steps.plan.outputs.scope != 'none'
        run: mkdir -p "$TMPDIR"
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version-file: .nvmrc
      - name: Install dependencies
        if: matrix.suite != 'overlays' && steps.plan.outputs.scope != 'none'
        run: $YARN install --immutable --check-cache
      - name: Build shared dependencies
        if: matrix.suite != 'overlays' && steps.plan.outputs.scope != 'none'
        run: $YARN nx build twenty-shared --skip-nx-cache --parallel=1
      - name: Run ${{ matrix.suite }}
        if: steps.plan.outputs.scope == 'legacy'
        run: ${{ matrix.command }}
      - name: Run ${{ matrix.suite }} (${{ steps.plan.outputs.scope }})
        if: steps.plan.outputs.scope != 'legacy'
        env:
          SUITE: ${{ matrix.suite }}
        run: bash "$SELECTOR" run "$SUITE" "$TEST_BASE"
      - name: Release workspace disk
        if: always()
        # O checkout é efêmero. Mantém o repositório, mas remove dependências,
        # caches e artefatos ignorados antes de liberar o runner para outra suíte.
        run: |
          git clean -ffdx
          if [ -d "$TMPDIR" ]; then
            find "$TMPDIR" -mindepth 1 -delete
            rmdir "$TMPDIR"
          fi

  cleanup:
    needs: tests
    if: always() && github.event_name == 'push'
    runs-on: [self-hosted, linux, x64, jotaduo-ci]
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Delete trigger branch
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_BRANCH: ${{ github.ref_name }}
        run: gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$TRIGGER_BRANCH"
