# Testes do fork jotaduo2-eng/jotaduo-v0.01 em runners do GitHub. Este repositório guarda só o workflow: o código
# vem do repositório privado com um token curto do GitHub App e o resultado volta ao commit do pull request como o
# check run "ci-publico". A chave do App só existe em "start", "fetch" e "report", que não executam o código baixado;
# os jobs de teste recebem os arquivos por artefato (público por um dia) e não referenciam segredo nenhum.
name: Tests

on:
  # O workflow Relay dispara este a partir da main, para as execuções dividirem o mesmo cache.
  # trigger: run/pr-<n>-<sha>-<execução>-<tentativa> testa o merge do PR com as suítes inteiras;
  # run/affected-merge-pr-<n>-<sha>-... testa o commit de merge informado, só no que o diff alcança.
  workflow_dispatch:
    inputs:
      trigger:
        description: Branch de disparo criada pelo repositório privado
        type: string
      sha:
        description: Commit do repositório privado (40 caracteres hexadecimais), para um teste manual
        type: string

permissions: {}

concurrency:
  group: tests-${{ inputs.trigger || inputs.sha }}
  cancel-in-progress: true

run-name: Tests ${{ inputs.trigger || inputs.sha }}

env:
  SOURCE_OWNER: jotaduo2-eng
  SOURCE_REPO: jotaduo-v0.01
  APP_ID: 5895369
  CHECK_TITLE: shared, frontend, server, ui, cli, typecheck e lint

jobs:
  start:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: ci
    outputs:
      ref: ${{ steps.ref.outputs.ref }}
      sha: ${{ steps.ref.outputs.sha }}
      check_sha: ${{ steps.head.outputs.sha }}
      base: ${{ steps.ref.outputs.base }}
      check: ${{ steps.check.outputs.id }}
    steps:
      - name: Resolve source ref
        id: ref
        env:
          TRIGGER: ${{ inputs.trigger }}
          INPUT_SHA: ${{ inputs.sha }}
        run: |
          base=full
          if [[ "$TRIGGER" =~ ^run/affected-merge-pr-[0-9]+-([0-9a-f]{40})-[0-9]+-[0-9]+$ ]]; then
            sha=${BASH_REMATCH[1]}; ref=$sha; base='HEAD^1'
          elif [[ "$TRIGGER" =~ ^run/(affected-)?pr-([0-9]+)-([0-9a-f]{40})(-[0-9]+-[0-9]+)?$ ]]; then
            sha=${BASH_REMATCH[3]}; ref=refs/pull/${BASH_REMATCH[2]}/merge
          elif [ -z "$TRIGGER" ] && [[ "$INPUT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            sha=$INPUT_SHA; ref=$INPUT_SHA
          else
            echo 'Informe um trigger run/... válido ou um sha de 40 caracteres.' >&2; exit 1
          fi
          { echo "sha=$sha"; echo "ref=$ref"; echo "base=$base"; } >> "$GITHUB_OUTPUT"
      - uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        id: app
        with:
          app-id: ${{ env.APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: ${{ env.SOURCE_OWNER }}
          repositories: ${{ env.SOURCE_REPO }}
          permission-checks: write
          permission-contents: read
      # O GitHub só liga ao pull request um check publicado no head dele, não no commit de merge.
      - name: Resolve check commit
        id: head
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          SHA: ${{ steps.ref.outputs.sha }}
          BASE: ${{ steps.ref.outputs.base }}
        run: |
          head=$SHA
          if [ "$BASE" != full ]; then
            head=$(gh api "repos/$SOURCE_OWNER/$SOURCE_REPO/commits/$SHA" --jq '.parents[1].sha // empty')
            [[ "$head" =~ ^[0-9a-f]{40}$ ]] || { echo 'o commit informado não é um merge de pull request' >&2; exit 1; }
          fi
          echo "sha=$head" >> "$GITHUB_OUTPUT"
      - name: Open check run
        id: check
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          SHA: ${{ steps.head.outputs.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          id="$(gh api "repos/$SOURCE_OWNER/$SOURCE_REPO/check-runs" \
            -f name=ci-publico -f head_sha="$SHA" -f status=in_progress -f details_url="$RUN_URL" \
            -f "output[title]=$CHECK_TITLE" -f "output[summary]=Em andamento." --jq .id)"
          [[ "$id" =~ ^[0-9]+$ ]] || { echo 'resposta sem id do check'; exit 1; }
          echo "id=$id" >> "$GITHUB_OUTPUT"

  # Único job que lê o repositório privado. Não executa nada do que baixa.
  fetch:
    needs: start
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ci
    outputs:
      prepared_key: ${{ steps.key.outputs.value }}
    steps:
      - uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        id: app
        with:
          app-id: ${{ env.APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: ${{ env.SOURCE_OWNER }}
          repositories: ${{ env.SOURCE_REPO }}
          permission-contents: read
      # Planos, deploy, workflows e instruções de agentes não entram no artefato público.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.SOURCE_OWNER }}/${{ env.SOURCE_REPO }}
          ref: ${{ needs.start.outputs.ref }}
          token: ${{ steps.app.outputs.token }}
          persist-credentials: false
          path: src
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/.agent-flow/
            !/.agent-kit/
            !/.agents/
            !/.claude/
            !/.codex/
            !/.concord/
            !/.github/
            !/.mcp.json
            !/.vscode/
            !/deploy/
            !/docs/
            !/packages/twenty-website/*
            /packages/twenty-website/package.json
      - name: Check the source arrived
        run: test -f src/yarn.lock && test -d src/packages/twenty-server && test ! -e src/deploy && test ! -e src/docs
      # O upload segue links: um link no commit levaria arquivos do runner para o artefato público.
      - name: Refuse symbolic links
        run: '[ -z "$(find src -path src/.git -prune -o -type l -print)" ] || { echo "link simbólico no commit"; exit 1; }'
      # Só nomes e estados, lidos da API: os jobs de teste refazem com eles o diff que o seletor consulta.
      - name: List changed files
        if: needs.start.outputs.base != 'full'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          SHA: ${{ needs.start.outputs.sha }}
        run: |
          test ! -e src/.ci-changes.json
          parent=$(gh api "repos/$SOURCE_OWNER/$SOURCE_REPO/commits/$SHA" --jq '.parents[0].sha')
          [[ "$parent" =~ ^[0-9a-f]{40}$ ]]
          for page in 1 2 3; do
            gh api "repos/$SOURCE_OWNER/$SOURCE_REPO/compare/$parent...$SHA?per_page=100&page=$page" \
              --jq '[.files[]? | {filename, status, previous_filename}]'
          done | jq -s 'add' > changes.json
          # A API corta a lista em 300 arquivos: a partir daí as suítes rodam inteiras.
          if [ "$(jq length changes.json)" -lt 300 ]; then mv changes.json src/.ci-changes.json; fi
      # O prepare só baixa o artefato quando esta chave ainda não está no cache.
      - name: Compute preparation key
        id: key
        run: echo "value=prepared-v2-${{ runner.os }}-$(tr -d '[:space:]' < src/.nvmrc)-${{ hashFiles('src/yarn.lock', 'src/.yarnrc.yml', 'src/.yarn/releases/**', 'src/package.json', 'src/packages/*/package.json', 'src/packages/twenty-shared/**') }}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: source
          retention-days: 1
          include-hidden-files: true
          if-no-files-found: error
          path: |
            src/
            !src/.git/

  # Instala as dependências e compila o twenty-shared uma vez por combinação de lockfile e fontes do shared.
  # Instala as dependências e compila o twenty-shared uma vez por combinação de lockfile e fontes do shared.
  prepare:
    needs: fetch
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NX_DAEMON: 'false'
      NX_NO_CLOUD: 'true'
      YARN: node .yarn/releases/yarn-4.18.1.cjs
      PREPARED_KEY: ${{ needs.fetch.outputs.prepared_key }}
    steps:
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: prepared
        with:
          lookup-only: true
          key: ${{ env.PREPARED_KEY }}
          path: |
            node_modules
            packages/*/node_modules
            packages/twenty-shared
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: steps.prepared.outputs.cache-hit != 'true'
        with:
          name: source
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.prepared.outputs.cache-hit != 'true'
        with:
          package-manager-cache: false
          node-version-file: .nvmrc
      # A chave é o yarn.lock: com --immutable o Yarn confere cada pacote contra os checksums dele.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: steps.prepared.outputs.cache-hit != 'true'
        with:
          path: ~/.yarn/berry/cache
          key: yarn-${{ hashFiles('yarn.lock') }}
      - name: Install dependencies
        if: steps.prepared.outputs.cache-hit != 'true'
        run: $YARN install --immutable
      # O Nx espera estar dentro de um repositório Git.
      - name: Build shared dependencies
        if: steps.prepared.outputs.cache-hit != 'true'
        run: |
          git init -q -b main
          $YARN nx build twenty-shared --skip-nx-cache --parallel=1
          rm -rf .git
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: steps.prepared.outputs.cache-hit != 'true'
        with:
          key: ${{ env.PREPARED_KEY }}
          path: |
            node_modules
            packages/*/node_modules
            packages/twenty-shared

  tests:
    name: ${{ matrix.suite }}${{ matrix.shard && format(' {0}', matrix.shard) || '' }}
    needs: [start, fetch, prepare]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: shared
          - suite: frontend
          # O test:ci do servidor usa um worker só; três partes em runners separados dividem os 17 minutos.
          - suite: server
            shard: 1/3
          - suite: server
            shard: 2/3
          - suite: server
            shard: 3/3
          - suite: ui
          - suite: cli
          # Typecheck e lint olham os pacotes inteiros, não só o que o diff alcança.
          - suite: typecheck-server
            command: $YARN nx typecheck twenty-server --skip-nx-cache
          - suite: typecheck-front
            command: $YARN nx typecheck twenty-front --skip-nx-cache
          # lint:unlocalized-strings do front já falha na main e bloquearia o oxlint, que depende dele.
          - suite: lint-server
            command: $YARN nx build twenty-oxlint-rules --skip-nx-cache && $YARN nx lint twenty-server --exclude-task-dependencies --skip-nx-cache
          - suite: lint-front
            command: $YARN nx build twenty-oxlint-rules --skip-nx-cache && $YARN nx lint twenty-front --exclude-task-dependencies --skip-nx-cache
    env:
      CI: 'true'
      NX_DAEMON: 'false'
      NX_NO_CLOUD: 'true'
      NODE_OPTIONS: --max-old-space-size=6144
      YARN: node .yarn/releases/yarn-4.18.1.cjs
      SELECTOR: packages/twenty-utils/ci/run-affected-tests.sh
    steps:
      # A instalação do monorepo não cabe no disco livre padrão; a limpeza segue em segundo plano.
      - name: Free runner disk
        run: sudo nohup rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost > /dev/null 2>&1 &
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: source
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version-file: .nvmrc
      # O artefato não traz histórico. Com a lista do diff, o repositório local ganha um commit base
      # que difere do testado exatamente nesses caminhos: é o que o seletor consulta com git diff.
      - name: Create a local repository
        id: repository
        env:
          RUN_ID: ${{ github.run_id }}
          BASE: ${{ needs.start.outputs.base }}
        run: |
          git config --global user.name jotaduo-ci
          git config --global user.email jotaduo-ci@users.noreply.github.com
          git init -q -b main
          if [ -f .ci-changes.json ]; then mv .ci-changes.json "$RUNNER_TEMP/changes.json"; fi
          # Sem a lista (diff grande demais para a API) as suítes rodam inteiras.
          if [ ! -f "$RUNNER_TEMP/changes.json" ]; then BASE=full; fi
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          python3 - "$RUNNER_TEMP/changes.json" <<'PY'
          import json, os, subprocess, sys

          def git(*arguments):
              return subprocess.run(['git', *arguments], check=True, text=True, capture_output=True).stdout.strip()

          def inside(path):
              normalized = os.path.normpath(path)
              if os.path.isabs(normalized) or normalized.split(os.sep)[0] in ('..', '.git'):
                  sys.exit('caminho inválido na lista do diff')
              return normalized

          def stub(path, label):
              os.makedirs(os.path.dirname(path) or '.', exist_ok=True)
              with open(path, 'w') as file:
                  file.write(label + ' ' + os.environ['RUN_ID'] + '\n')

          def remove(path):
              if os.path.lexists(path):
                  os.remove(path)

          changes = json.load(open(sys.argv[1])) if os.path.exists(sys.argv[1]) else None
          if changes is None:
              git('add', '-A')
              git('commit', '-q', '-m', 'head')
              sys.exit(0)

          # Caminhos fora do artefato (docs, deploy, workflows) entram como marcadores.
          for change in changes:
              path = inside(change['filename'])
              if change['status'] != 'removed' and not os.path.lexists(path):
                  stub(path, 'head')
          git('add', '-A', '-f')
          head_tree = git('write-tree')

          for change in changes:
              path = inside(change['filename'])
              status = change['status']
              if status in ('added', 'copied'):
                  remove(path)
              elif status == 'renamed':
                  remove(path)
                  stub(inside(change['previous_filename']), 'base')
              else:
                  stub(path, 'base')
          git('add', '-A', '-f')
          base_commit = git('commit-tree', git('write-tree'), '-m', 'base')
          head_commit = git('commit-tree', head_tree, '-p', base_commit, '-m', 'head')
          git('reset', '-q', '--hard', head_commit)
          PY
      - name: Plan ${{ matrix.suite }}
        id: plan
        env:
          SUITE: ${{ matrix.suite }}
          COMMAND: ${{ matrix.command }}
          SHARD: ${{ matrix.shard }}
          TEST_BASE: ${{ steps.repository.outputs.base }}
        run: |
          scope=full
          if [ -z "$COMMAND" ]; then scope=$(bash "$SELECTOR" plan "$SUITE" "$TEST_BASE"); fi
          # Testes relacionados são poucos: rodam só na primeira parte.
          if [ -n "$SHARD" ] && [ "$scope" != full ] && [ "${SHARD%%/*}" != 1 ]; then scope=none; fi
          echo "scope=$scope" | tee -a "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: prepared
        if: steps.plan.outputs.scope != 'none'
        with:
          key: ${{ needs.fetch.outputs.prepared_key }}
          path: |
            node_modules
            packages/*/node_modules
            packages/twenty-shared
      - name: Install dependencies
        if: steps.plan.outputs.scope != 'none' && steps.prepared.outputs.cache-hit != 'true'
        run: $YARN install --immutable
      - name: Build shared dependencies
        if: steps.plan.outputs.scope != 'none' && steps.prepared.outputs.cache-hit != 'true'
        run: $YARN nx build twenty-shared --skip-nx-cache --parallel=1
      - name: Run ${{ matrix.suite }} ${{ matrix.shard }} (${{ steps.plan.outputs.scope }})
        if: matrix.command == '' && !(matrix.shard && steps.plan.outputs.scope == 'full')
        env:
          SUITE: ${{ matrix.suite }}
          TEST_BASE: ${{ steps.repository.outputs.base }}
        run: bash "$SELECTOR" run "$SUITE" "$TEST_BASE"
      - name: Run ${{ matrix.suite }} ${{ matrix.shard }} (full)
        if: matrix.shard && steps.plan.outputs.scope == 'full'
        env:
          SHARD: ${{ matrix.shard }}
        run: $YARN nx run twenty-server:test:ci --skip-nx-cache --parallel=1 -- --shard="$SHARD"
      - name: Run ${{ matrix.suite }}
        if: matrix.command != ''
        run: ${{ matrix.command }}

  report:
    needs: [start, fetch, prepare, tests]
    # Sempre roda, para o check aberto em "start" não ficar em andamento.
    if: ${{ always() && needs.start.outputs.check_sha != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: ci
    steps:
      - uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        id: app
        with:
          app-id: ${{ env.APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: ${{ env.SOURCE_OWNER }}
          repositories: ${{ env.SOURCE_REPO }}
          permission-checks: write
      - name: Publish check run
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          SHA: ${{ needs.start.outputs.check_sha }}
          CHECK: ${{ needs.start.outputs.check }}
          OK: ${{ needs.fetch.result == 'success' && needs.prepare.result == 'success' && needs.tests.result == 'success' }}
          CANCELLED: ${{ contains(needs.*.result, 'cancelled') }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SUMMARY: 'fetch: ${{ needs.fetch.result }}; preparo: ${{ needs.prepare.result }}; testes: ${{ needs.tests.result }}'
        run: |
          conclusion=failure
          [ "$CANCELLED" = true ] && conclusion=cancelled
          [ "$OK" = true ] && conclusion=success
          target=(-X POST "repos/$SOURCE_OWNER/$SOURCE_REPO/check-runs" -f head_sha="$SHA")
          if [[ "$CHECK" =~ ^[0-9]+$ ]]; then target=(-X PATCH "repos/$SOURCE_OWNER/$SOURCE_REPO/check-runs/$CHECK"); fi
          for try in 1 2 3; do
            gh api "${target[@]}" -f name=ci-publico -f status=completed -f conclusion="$conclusion" \
              -f details_url="$RUN_URL" -f "output[title]=$CHECK_TITLE" -f "output[summary]=$SUMMARY" > /dev/null && break
            [ "$try" = 3 ] && { echo 'não foi possível concluir o check ci-publico'; exit 1; }
            sleep 10
          done
          echo "ci-publico: $conclusion em $SHA"
